    <!-- Tema antes del primer pintado: evita el destello claro→oscuro y deja listo el splash estático. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('findp_theme') || 'auto'
          if (t === 'auto') {
            var h = new Date().getHours()
            t = h >= 19 || h < 6 ? 'dark' : 'calido'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <style>
      /* Splash estático: se ve mientras carga el JS y se reemplaza al montar React. */
      #splash-estatico { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f7f4ee; }
      #splash-estatico .cuerpo { fill: #d9622b; }
      :root[data-theme='dark'] #splash-estatico { background: #17140f; }
      :root[data-theme='dark'] #splash-estatico .cuerpo { fill: #e8823f; }
    </style>
